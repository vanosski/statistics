<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    
    <!-- Gold Crown Gradient -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Neon Gem Gradient -->
    <linearGradient id="gemNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crownGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#6366f1" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#goldCrown)" stroke-width="6" opacity="0.35"/>

  <!-- Golden Crown Symbol with Outer Glow -->
  <g filter="url(#crownGlow)">
    <!-- Base Arch -->
    <path d="M100 370 L130 190 L210 270 L256 130 L302 270 L382 190 L412 370 Z" 
          fill="url(#goldCrown)" 
          stroke="#fff" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Bottom Crown Band -->
    <rect x="100" y="380" width="312" height="34" rx="10" fill="url(#goldCrown)"/>
    <rect x="110" y="388" width="292" height="18" rx="6" fill="#1e1b4b" opacity="0.6"/>

    <!-- Crown Jewels / Orbs -->
    <circle cx="130" cy="180" r="20" fill="url(#goldCrown)"/>
    <circle cx="130" cy="180" r="12" fill="url(#gemNeon)"/>

    <circle cx="256" cy="118" r="26" fill="url(#goldCrown)"/>
    <circle cx="256" cy="118" r="16" fill="#06b6d4"/>

    <circle cx="382" cy="180" r="20" fill="url(#goldCrown)"/>
    <circle cx="382" cy="180" r="12" fill="url(#gemNeon)"/>

    <!-- Center Band Gems -->
    <circle cx="180" cy="397" r="6" fill="#06b6d4"/>
    <circle cx="256" cy="397" r="8" fill="url(#gemNeon)"/>
    <circle cx="332" cy="397" r="6" fill="#06b6d4"/>
  </g>
</svg>